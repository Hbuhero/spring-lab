spring.application.name=SpringSecurityTemplate
spring.main.banner-mode=off
server.port=8080
debug=true


#Application Configuration
application.title=Spring Security Template
application.formatted-version=1.1
application.jwtSecret=
application.jwtExpiration=8640000
application.refreshTokenExpiration=8640000
application.passwordResetTokenExpiration=8640000
application.fileUploadPath=/var/spring_security_template/uploads
application.fileDownloadPath=/var/spring_security_template/uploads


#Logging configuration
logging.level.root=WARN
logging.level.hud.SpringSecurityTemplate=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.security=TRACE


spring.datasource.url=jdbc:postgresql://localhost:5432/{database_name}
spring.datasource.username=postgres
spring.datasource.password=

# Database Connection Pool Configuration (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.main.allow-circular-references=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=true
spring.datasource.hikari.auto-commit=false


# Performance Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Query Performance
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Second Level Cache (if needed)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Cache Configuration
spring.cache.type=caffeine
# spring.cache.cache-names=users,regions,districts,wards,villages,user-by-email,user-by-amcos,user-by-mcu
spring.cache.caffeine.spec=initialCapacity=100,maximumSize=1000,expireAfterAccess=30m,expireAfterWrite=60m,recordStats


#File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=mail.gmail.com
spring.mail.properties.mail.debug=false

# Application Email Settings
app.name=Secure System
app.url=http://localhost:8080
app.support.email=

